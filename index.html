<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#061b36" />
    <title>Arctic Kart // Ice Circuit</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="marquee"><span>ARCTIC KART</span><em> // ICE CIRCUIT</em></header>
      <section class="game-frame" aria-label="Arctic Kart racing game">
        <canvas id="game" aria-label="Playable Arctic Kart game"></canvas>
        <div id="hud" class="hud" aria-live="polite">
          <div class="hud-card"><small>LAP</small><strong id="lap">1 / 3</strong></div>
          <div class="hud-card timer"><small>TIME</small><strong id="time">00:00.000</strong></div>
          <div class="hud-card"><small>BEST</small><strong id="best">--:--.---</strong></div>
        </div>
        <div id="banner" class="banner"><h1>ARCTIC KART</h1><p>WASD / ARROWS TO DRIVE · DRIFT WITH SPACE</p><button id="start">START RACE</button></div>
      </section>
      <footer><span>ICE PATCHES: TURBO OR TUMBLE</span><span>3 LAPS TO GLORY</span></footer>
    </main>
    <script src="game.js"></script>
  </body>
</html>
